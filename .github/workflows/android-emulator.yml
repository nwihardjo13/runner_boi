name: Android emulator smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: runner-boi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel
          disable-animations: true
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: emulator-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          build="${GITHUB_RUN_NUMBER}"
          tag="v${version}+${build}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing key
        shell: bash
        env:
          RUNNER_BOI_ANDROID_KEYSTORE_BASE64: ${{ secrets.RUNNER_BOI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$RUNNER_BOI_ANDROID_KEYSTORE_BASE64"
          echo "$RUNNER_BOI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/runner-boi-release.keystore"

      - name: Build arm64 release APK
        env:
          RUNNER_BOI_ANDROID_KEYSTORE: ${{ runner.temp }}/runner-boi-release.keystore
          RUNNER_BOI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RUNNER_BOI_ANDROID_KEYSTORE_PASSWORD }}
          RUNNER_BOI_ANDROID_KEY_ALIAS: ${{ secrets.RUNNER_BOI_ANDROID_KEY_ALIAS }}
          RUNNER_BOI_ANDROID_KEY_PASSWORD: ${{ secrets.RUNNER_BOI_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"

      - name: Prepare release asset
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "runner-boi-${{ steps.version.outputs.tag }}-arm64-v8a.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "runner-boi-${{ steps.version.outputs.tag }}-arm64-v8a.apk" \
            --target "${{ github.sha }}" \
            --title "Runner Boi ${{ steps.version.outputs.tag }}" \
            --notes "Automated release from main push ${{ github.sha }}.

          Android artifact:
          - arm64-v8a APK for modern Android phones, including Pixel 9.

          Verification:
          - flutter analyze
          - flutter test
          - Android emulator smoke test"
